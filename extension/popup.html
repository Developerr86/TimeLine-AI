<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #eee;
      margin: 0;
    }
    
    h1 {
      margin: 0 0 16px 0;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    h1::before {
      content: "⏱️";
    }
    
    .status {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .status-row:last-child {
      margin-bottom: 0;
    }
    
    .label {
      color: #888;
      font-size: 12px;
    }
    
    .value {
      font-size: 13px;
      font-weight: 500;
    }
    
    .scenario-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .scenario-VIDEO { background: #e74c3c; }
    .scenario-DOC { background: #3498db; }
    .scenario-WEB { background: #2ecc71; }
    .scenario-OTHER { background: #95a5a6; }
    .scenario-IDLE { background: #f39c12; }
    
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .toggle-label {
      font-size: 14px;
    }
    
    .toggle {
      position: relative;
      width: 48px;
      height: 24px;
    }
    
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #555;
      transition: 0.3s;
      border-radius: 24px;
    }
    
    .slider::before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #2ecc71;
    }
    
    input:checked + .slider::before {
      transform: translateX(24px);
    }
    
    .url-display {
      font-size: 11px;
      color: #aaa;
      word-break: break-all;
      max-height: 40px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <h1>TimeLine Tracker</h1>
  
  <div class="status">
    <div class="status-row">
      <span class="label">Status</span>
      <span class="value" id="status-text">Active</span>
    </div>
    <div class="status-row">
      <span class="label">Scenario</span>
      <span class="scenario-badge scenario-OTHER" id="scenario-badge">--</span>
    </div>
    <div class="status-row">
      <span class="label">Current Page</span>
    </div>
    <div class="url-display" id="current-url">--</div>
  </div>
  
  <div class="toggle-container">
    <span class="toggle-label">Enable Tracking</span>
    <label class="toggle">
      <input type="checkbox" id="toggle-enabled" checked>
      <span class="slider"></span>
    </label>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
